// OpenCluster Relay protocol v1 — the bidirectional session stream.
//
// One outbound TLS connection from the Relay carries exactly one Connect stream. The
// relay identity and credential travel in call METADATA ("opencluster-org-id",
// "opencluster-registration-id", "opencluster-relay-credential"; the credential is
// verified server-side against a constant-time digest — never a KDF on the connect
// path). The stream is a DELIVERY CHANNEL ONLY: durable job state lives in the
// control plane's database; every job is leased and fenced by (job_id, server
// session id, lease_epoch) under the control-plane clock, and a stream disconnect
// can neither lose nor silently complete a job.
//
// Envelope evolution is ADDITIVE (new oneof variants, new fields); capability
// argument/result messages are strict and frozen (see
// kubernetes_workload_runtime.proto).
// Neither side uses google.protobuf.Any/Struct/Value, maps, raw JSON payloads, or
// command/script/path fields — enforced by the CI schema-shape gate. Receivers
// refuse messages carrying unknown fields in capability payloads (recursive
// protoreflect walk; DiscardUnknown is forbidden).

syntax = "proto3";

package opencluster.relay.v1;

import "google/protobuf/duration.proto";
import "opencluster/relay/v1/inventory_synchronization.proto";
import "opencluster/relay/v1/kubernetes_container_logs.proto";
import "opencluster/relay/v1/kubernetes_namespace_events.proto";
import "opencluster/relay/v1/kubernetes_workload_runtime.proto";
import "opencluster/relay/v1/registration.proto";

option csharp_namespace = "OpenCluster.Relay.Protocol.V1";
option go_package = "github.com/open-cluster/oc-relay/gen/go/opencluster/relay/v1;relayv1";

// ---------------------------------------------------------------------------------
// Capability payload wrappers: a CLOSED oneof per direction. Adding a capability is
// an additive envelope change; each variant is a frozen versioned message.
// ---------------------------------------------------------------------------------

message CapabilityArguments {
  oneof arguments {
    KubernetesWorkloadRuntimeArgsV1 kubernetes_workload_runtime_v1 = 10;
    KubernetesNamespaceEventsArgsV1 kubernetes_namespace_events_v1 = 11;
    KubernetesContainerLogsArgsV1 kubernetes_container_logs_v1 = 12;
  }
}

message CapabilityResult {
  // What this organization's own redaction policy withheld before the result was
  // serialized. It rides INSIDE the capability payload rather than beside it because
  // the control plane persists this message and nothing else: a report on the envelope
  // would be dropped at the recording transaction, and masking would be indistinguishable
  // from absence exactly where it matters most.
  RedactionReport redaction = 1;
  oneof result {
    KubernetesWorkloadRuntimeResultV1 kubernetes_workload_runtime_v1 = 10;
    KubernetesNamespaceEventsResultV1 kubernetes_namespace_events_v1 = 11;
    KubernetesContainerLogsResultV1 kubernetes_container_logs_v1 = 12;
  }
}

// What redaction removed, reported as counts and rule identifiers and NOTHING else.
//
// The masked value is never transmitted in any form: not partially, not length-preserved,
// and not as a digest — a hash of a low-entropy secret is recoverable by brute force, which
// would defeat the purpose while appearing to serve it. The occurrence count is a
// deliberate, bounded side channel: reporting that a field held four masked values tells
// the platform something it would not otherwise know, and the alternative — reporting
// nothing — makes masking indistinguishable from absence, which is the more serious failure.
//
// An absent report means nothing was masked. It never means redaction did not run: a result
// that did not pass the enforcement point is never serialized at all.
message RedactionReport {
  repeated RedactedField fields = 1;
}

// One declared free-text field the policy swept, and what it found there.
message RedactedField {
  // The declared field, in the contract's own terms — the result message's field, dotted
  // through any repeated message it sits in, as in
  // "kubernetes_container_logs_v1.lines.content". Named rather than numbered so an
  // operator reading a coverage gap recognises what was withheld.
  string field_name = 1;
  // How many occurrences were masked in it, across every element of a repeated field.
  uint32 masked_occurrence_count = 2;
  // Which rules matched, deduplicated and ordered, so a reader can ask the right person
  // to adjust the policy rather than guessing which pattern was too broad.
  repeated string rule_ids = 3;
}

// ---------------------------------------------------------------------------------
// Relay → control plane
// ---------------------------------------------------------------------------------

// One job still executing from a previous session generation. ATTESTED input with no
// authority of its own: it can only cause lease renewal for jobs already assigned to
// this registration under a valid epoch — fencing decides everything else.
message InFlightJob {
  string job_id = 1;
  uint64 lease_epoch = 2;
  // Monotonic elapsed execution time, measured Relay-side. Never enters a fence.
  int64 elapsed_ms = 3;
}

message Hello {
  uint32 protocol_version = 1;
  string relay_version = 2;
  repeated CapabilityDescriptor capabilities = 3;
  string cluster_fingerprint = 4;
  // Hash of the customer-authored local policy; drift visibility for operators.
  // The control plane makes no security decision from it.
  string local_policy_hash = 5;
  // Concurrent-job capacity from the customer's local policy; the server never
  // dispatches beyond it. Coupled Relay-side to the unacked-result buffer capacity.
  uint32 max_concurrent_jobs = 6;
  // Self-report of the dangerous insecureDisableEndpointPinning flag; surfaced on
  // the Integrations health page.
  bool endpoint_pinning_disabled = 7;
  repeated InFlightJob in_flight = 8;
}

// Proves session liveness ONLY — never job progress or completion. Job truth advances
// exclusively through the durable store; leases expire on the control-plane clock
// regardless of heartbeats.
message Heartbeat {
  uint64 sequence = 1;
  // Attestations refreshed between hellos; last-seen is stamped server-side.
  string local_policy_hash = 2;
  uint32 in_flight_count = 3;
  // Freshness stamps for every inventory scope this Relay synchronizes. On the
  // heartbeat rather than in a message of their own because a tick that found nothing
  // changed sends no delta, and the ledger's currency must still be confirmed rather
  // than assumed.
  repeated InventoryScopeStatus inventory_scopes = 4;
}

// Assignment received and queued for execution. Proves reception ONLY — the job was
// already durably leased when it was claimed for dispatch, so this changes no durable
// state and promises nothing about execution. Duplicates are ignored.
message JobAck {
  string job_id = 1;
  uint64 lease_epoch = 2;
}

// Execution began on the Relay. Advisory: no durable job-state transition — the lease
// already covers the job — and beginning proves nothing about finishing.
message JobStarted {
  string job_id = 1;
  uint64 lease_epoch = 2;
}

// Typed execution failure. No free-text from source faults: detail carries at most
// an exception TYPE NAME, mirroring the central totality contract.
message JobFailure {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_TIMEOUT = 1;
    KIND_CANCELLED = 2;
    KIND_UNSUPPORTED_CAPABILITY_VERSION = 3;
    KIND_ARGUMENTS_REJECTED = 4;
    KIND_RESULT_TOO_LARGE = 5;
    KIND_IDENTITY_MISMATCH = 6;
    KIND_LOCAL_POLICY_REFUSED = 7;
    KIND_INTERNAL = 8;
  }
  Kind kind = 1;
  string detail = 2;
}

// A job's outcome, NOT its durable fate: nothing is final until the control plane's
// recording transaction commits. The Relay retains the result in its bounded unacked
// buffer and resends it until a definitive ResultAck; recording is idempotent, so
// resends are safe.
message JobResult {
  string job_id = 1;
  // Echoes the assignment's epoch — the fence's wire round-trip. Results from a
  // previous epoch lose the fence server-side and are audited.
  uint64 lease_epoch = 2;
  oneof outcome {
    CapabilityResult result = 3;
    JobFailure failure = 4;
  }
  // Monotonic execution duration, Relay-measured; provenance only.
  int64 execution_duration_ms = 5;
}

// Cancellation processing outcome. Changes no durable state itself: an aborted job's
// terminal outcome still arrives as a JobResult failure (KIND_CANCELLED) — there is
// exactly one write path into job truth.
message CancelAck {
  enum Disposition {
    DISPOSITION_UNSPECIFIED = 0;
    DISPOSITION_ABORTED = 1;
    // Result was already produced before the cancel arrived; the result wins and is
    // (re)delivered — data beats a cancellation.
    DISPOSITION_ALREADY_COMPLETED = 2;
  }
  string job_id = 1;
  uint64 lease_epoch = 2;
  Disposition disposition = 3;
}

message DrainState {
  bool draining = 1;
  uint32 in_flight_count = 2;
  uint32 unacked_result_count = 3;
}

// Successor credential persisted durably; the server revokes the predecessor only
// after receiving this (write-order: persist first, confirm after).
message RotationConfirm {
  string rotation_id = 1;
}

// Relay → control violation report, sent before the Relay disconnects. The control
// plane, as the gRPC server, signals its own refusals by terminating the stream with a
// status instead. Neither direction's protocol error touches durable job state: leases
// and the periodic sweep own recovery.
message ProtocolError {
  enum Code {
    CODE_UNSPECIFIED = 0;
    CODE_MALFORMED_MESSAGE = 1;
    CODE_UNKNOWN_FIELDS_REFUSED = 2;
    CODE_UNSUPPORTED_PROTOCOL_VERSION = 3;
    CODE_INTAKE_SHED = 4;
  }
  Code code = 1;
  string detail = 2;
}

message RelayToControl {
  oneof message {
    Hello hello = 1;
    Heartbeat heartbeat = 2;
    JobAck job_ack = 3;
    JobStarted job_started = 4;
    JobResult job_result = 5;
    CancelAck cancel_ack = 6;
    DrainState drain_state = 7;
    RotationConfirm rotation_confirm = 8;
    ProtocolError protocol_error = 9;
    InventoryDelta inventory_delta = 10;
  }
}

// ---------------------------------------------------------------------------------
// Control plane → relay
// ---------------------------------------------------------------------------------

message SessionAccepted {
  // Server-minted session id — the lease owner for every job assigned on this
  // stream.
  string session_id = 1;
  uint32 protocol_version = 2;
  google.protobuf.Duration heartbeat_interval = 3;
  // Transport bounds; capability-level result caps sit strictly below max_send.
  uint32 max_receive_bytes = 4;
  uint32 max_send_bytes = 5;
}

// Sent only AFTER the durable claim transaction commits (queued → leased, owner = this
// session, epoch incremented). The assignment message itself is pure delivery: if it is
// lost, the due-work sweep and on-connect catch-up redeliver under the same or a
// successor lease — never a second durable claim for the same live lease.
message JobAssignment {
  string job_id = 1;
  // The Relay verifies BOTH against its bootstrap-bound identity; a mismatch is
  // refused (KIND_IDENTITY_MISMATCH) and audited locally as a possible
  // control-plane-compromise indicator.
  string org_id = 2;
  string registration_id = 3;
  uint64 lease_epoch = 4;
  string capability_id = 5;
  uint32 capability_version = 6;
  // Duration budget measured on the Relay's monotonic clock from receipt — never an
  // absolute timestamp compared to a Relay wall clock.
  google.protobuf.Duration deadline_budget = 7;
  string idempotency_key = 8;
  // Random token, provably free of incident/model/tenant semantics; audit-only.
  string correlation_id = 9;
  CapabilityArguments arguments = 10;
}

// Advisory request to stop executing. The job stays leased until its outcome is
// recorded or the lease expires; a result already produced when this arrives wins and
// is delivered anyway (see CancelAck).
message Cancellation {
  string job_id = 1;
  uint64 lease_epoch = 2;
}

// Sent ONLY after the durable fate of the result is known post-commit: RECORDED and
// ALREADY_RECORDED follow the recording transaction's commit (or a read of the
// existing terminal row); STALE follows a post-commit classification. Never
// optimistic — an unsent ack costs only a safe resend.
message ResultAck {
  enum Disposition {
    DISPOSITION_UNSPECIFIED = 0;
    DISPOSITION_RECORDED = 1;
    // Terminal row already exists (resend, or re-dispatch already recorded) —
    // definitive; the Relay drops the buffered result.
    DISPOSITION_ALREADY_RECORDED = 2;
    // Stale epoch while a successor epoch is still executing: stop resending this
    // copy; the job's fate belongs to the successor.
    DISPOSITION_STALE_STOP_RESENDING = 3;
  }
  string job_id = 1;
  uint64 lease_epoch = 2;
  Disposition disposition = 3;
}

// Issued while the predecessor credential stays valid for a bounded overlap window.
// Rate-bounded at Relay intake like every push (rotation writes touch the K8s API).
message CredentialRotation {
  string rotation_id = 1;
  string new_credential = 2;
}

// Stop accepting new assignments, finish or abandon in-flight work within the
// deadline, flush unacked results, then disconnect. Changes no durable job state:
// anything unfinished is recovered by lease expiry and the sweep.
message DrainInstruction {
  google.protobuf.Duration deadline = 1;
}

// Advisory minimum capability versions; absence of a capability at a required
// version surfaces centrally as a coverage gap, never a silent skip.
message CapabilityRequirements {
  repeated CapabilityDescriptor minimum_versions = 1;
}

message GracefulReconnect {
  // Explicit server-directed reconnect (deploys, rebalancing). An unexplained
  // GOAWAY re-enters normal backoff; it never resets it.
  google.protobuf.Duration retry_after = 1;
}

message ControlToRelay {
  oneof message {
    SessionAccepted session_accepted = 1;
    JobAssignment job_assignment = 2;
    Cancellation cancellation = 3;
    ResultAck result_ack = 4;
    CredentialRotation credential_rotation = 5;
    DrainInstruction drain_instruction = 6;
    CapabilityRequirements capability_requirements = 7;
    GracefulReconnect graceful_reconnect = 8;
    InventorySynchronizationPolicy inventory_synchronization_policy = 9;
    InventoryDeltaAck inventory_delta_ack = 10;
  }
}

// The session stream. Exactly one concurrent sender per direction per the gRPC
// stream contract; the Relay serializes all writes through a single sender
// goroutine draining a bounded channel.
service RelaySessionService {
  rpc Connect(stream RelayToControl) returns (stream ControlToRelay);
}
