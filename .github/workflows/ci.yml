# CI: verification only. This workflow deliberately contains NO registry push, image
# publish, module-proxy warm, or release-upload step — publication is founder-gated
# and is wired in as its own reviewed change when authorized. Actions are pinned by
# commit SHA (supply chain for the CI itself).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version-file: go.mod

      - name: Install pinned proto toolchain
        run: make tools

      - name: Lint (buf + gofmt + vet)
        run: make lint

      - name: Generated-code drift gate
        run: make gen-check

      # The checkout action fetches only the pull request's own ref, so the base branch is
      # not in the local repository and buf cannot resolve it. Without the explicit fetch
      # this gate fails to run at all rather than failing to find a breaking change, which
      # is how it stayed unexercised until the first pull request.
      - name: Protobuf breaking-change gate
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin \
            "+refs/heads/${{ github.base_ref }}:refs/heads/${{ github.base_ref }}"
          buf breaking --against ".git#branch=${{ github.base_ref }}"

      - name: Build (CGO disabled, trimpath)
        run: make build

      - name: Tests (race detector)
        run: make test

      # Both modules are scanned. The contract module is what other repositories import,
      # so an advisory reaching it reaches every consumer of the protocol.
      - name: Vulnerability scan (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...
          cd gen/go && govulncheck ./...

      - name: Dependency license check (advisory pre-R1)
        run: |
          go install github.com/google/go-licenses@v1.6.0
          go-licenses check ./... \
            --allowed_licenses=Apache-2.0,BSD-2-Clause,BSD-3-Clause,MIT,ISC,MPL-2.0 \
            --ignore github.com/open-cluster/oc-relay || true
          cd gen/go && go-licenses check ./... \
            --allowed_licenses=Apache-2.0,BSD-2-Clause,BSD-3-Clause,MIT,ISC,MPL-2.0 \
            --ignore github.com/open-cluster/oc-relay || true
          # || true until first-party packages exist; flips to hard-fail with R1 code.

      # The gitleaks GitHub Action refuses to run for organization-owned repositories without
      # a purchased licence key. The scanner itself is MIT-licensed, so the gate runs its
      # release binary directly: same scan, no commercial entitlement standing between the
      # repository and its own secret detection. The binary is pinned the same way the
      # actions above are — an exact version, with the archive checksummed before anything in
      # it executes.
      - name: Secret scan (gitleaks, full history)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          # Checkout uses fetch-depth 0, so --all --full-history reaches every commit on
          # every ref rather than only the tip of the branch under test.
          ./gitleaks git . --redact --exit-code 1 --log-opts="--all --full-history"
