# Deterministic generation: plugins run from the local toolchain at PINNED versions
# (protoc-gen-go v1.36.5, protoc-gen-go-grpc v1.5.1 — install via `make tools`).
# Generated Go is COMMITTED under gen/go; CI fails on drift (`make gen` + git diff).
# gen/go is its own Go module, so consumers import the contract at a pinned version
# instead of vendoring a copy of it — go.mod records what they took and go.sum verifies
# it, which is the property a hand-maintained copy cannot provide.
version: v2
plugins:
  - local: protoc-gen-go
    out: gen/go
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: gen/go
    opt: paths=source_relative
